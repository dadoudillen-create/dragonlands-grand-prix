name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: configure
        run: cmake -S src/sseplugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: build
        run: cmake --build build --target DragonlandsGP

      - name: upload unsigned plugin
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DragonlandsGP-unsigned
          path: build/DragonlandsGP.asi
          if-no-files-found: error

      # Code signing by SignPath Foundation (free for open-source projects). Enabled once the project is approved:
      # set the repository variable SIGNPATH_ENABLED=true and the secret SIGNPATH_API_TOKEN.
      - name: sign with SignPath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: dragonlands-grand-prix
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: upload signed plugin
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DragonlandsGP-signed
          path: signed/DragonlandsGP.asi
